name: test

on:
  - workflow_dispatch

permissions:
  contents: read

env:
  WORK_GIT_USERNAME: Test User
  WORK_GIT_EMAIL: test@example.com
  CI: "true"

jobs:
  test-on-macos:
    name: test on MacOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dotfiles
        run: sh -c "$(curl -fsLS --proto '=https' --tlsv1.2 https://get.chezmoi.io)" -- init --apply -S .
  test-on-ubuntu:
    name: test on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dotfiles
        run: sh -c "$(curl -fsLS --proto '=https' --tlsv1.2 https://get.chezmoi.io)" -- init --apply -S .
